<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NP Consultants &nbsp;&bull;&nbsp; Admin &nbsp;&bull;&nbsp; Webeditor</title>
    <link rel="stylesheet" href="../../../css/root.css">
    <link rel="stylesheet" href="../../css/admin-body.css">
    <link rel="stylesheet" href="../../css/admin-nav.css">
    <link rel="stylesheet" href="../../css/webeditor-logo.css">
    <link rel="stylesheet" href="../../../css/placeholder.css">
    <link rel="stylesheet" href="../../../css/limiter.css">
</head>
<body>
<div class="show-screen">
    <nav class="admin-nav" id="webeditor"></nav>
    <main class="webeditor-container">
        <div class="webeditor-header">
            <div>
                <div class="webeditor-title">Webeditor</div>
                <div class="webeditor-subtitle">Site Logos &nbsp;&bull;&nbsp; <i>All Pages</i></div>
            </div>
            <div class="webeditor-actions">
                <button class="webeditor-button back" type="button" onclick="location.href='../'">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Webeditor
                </button>
                <button type="button" class="webeditor-button secondary" id="reset-button">Reset</button>
                <button type="button" class="webeditor-button" id="save-button">Save Changes</button>
            </div>
        </div>

        <section class="logo-editor">
            <div class="logo-editor-header">
                <div class="logo-editor-name">Website Logos</div>
                <div class="logo-editor-description">
                    Manage the light and dark theme logos used throughout the website.
                </div>
            </div>

            <div class="logo-grid">
                <div class="logo-card">
                    <div class="logo-card-header">
                        <div>
                            <div class="logo-card-title">Dark Theme Logo</div>
                            <div class="logo-card-path" id="dark-logo-path">../../../icons/icon_dark.png</div>
                        </div>
                        <span class="logo-theme">Dark</span>
                    </div>

                    <div class="logo-preview">
                        <img id="dark-logo-preview" src="../../../icons/icon_dark.png" alt="Dark theme logo">
                    </div>

                    <label class="logo-upload">
                        <input type="file" id="dark-logo-upload" accept="image/*">
                        <span>Choose Image</span>
                    </label>
                </div>

                <div class="logo-card">
                    <div class="logo-card-header">
                        <div>
                            <div class="logo-card-title">Light Theme Logo</div>
                            <div class="logo-card-path" id="light-logo-path">../../../icons/icon_light.png</div>
                        </div>
                        <span class="logo-theme">Light</span>
                    </div>

                    <div class="logo-preview light">
                        <img id="light-logo-preview" src="../../../icons/icon_light.png" alt="Light theme logo">
                    </div>

                    <label class="logo-upload">
                        <input type="file" id="light-logo-upload" accept="image/*">
                        <span>Choose Image</span>
                    </label>
                </div>
            </div>
        </section>

        <div class="webeditor-status" id="webeditor-status"></div>
    </main>
</div>

<div class="screen-error">
    <div class="screen-error-container">
        <div class="screen-error-msg">Resolution Not Sufficient</div>
    </div>
</div>

<script src="../../js/nav-print.js"></script>
<script src="../../js/admin-nav-anim-manage.js"></script>
<script src="../../js/admin-webeditor-panel-anim.js"></script>
<script src="../../js/webeditor-logo.js"></script>
<script src="../../../js/theme.js"></script>
</body>
</html>
